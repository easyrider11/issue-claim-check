[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issue-claim-check"
version = "0.1.0"
description = "Check whether GitHub 'good first issues' already have someone working on them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lang Li" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[project.urls]
Homepage = "https://github.com/easyrider11/issue-claim-check"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
